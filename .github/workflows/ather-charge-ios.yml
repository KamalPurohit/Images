name: Ather Charge iOS

on:
  push:
    paths:
      - "AtherCharge/**"
      - ".github/workflows/ather-charge-ios.yml"
  workflow_dispatch:

jobs:
  test:
    name: AtherKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Run unit tests
        run: swift test --package-path AtherCharge/AtherKit
