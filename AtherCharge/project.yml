# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: AtherCharge

options:
  bundleIdPrefix: com.kamalpurohit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple team ID here to build straight to a phone from Xcode.
    DEVELOPMENT_TEAM: ""

packages:
  AtherKit:
    path: AtherKit

targets:
  AtherCharge:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: AtherKit
      - target: AtherChargeWidget
    entitlements:
      path: App/AtherCharge.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ather Charge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        AtherAppGroup: group.com.kamalpurohit.athercharge
        ALTAppGroups: [group.com.kamalpurohit.athercharge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamalpurohit.athercharge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AtherChargeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - package: AtherKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/AtherChargeWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Ather Charge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AtherAppGroup: group.com.kamalpurohit.athercharge
        ALTAppGroups: [group.com.kamalpurohit.athercharge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamalpurohit.athercharge.widget
